name: Deploy to GitHub Pages (backup)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Auto-enables Pages (GitHub Actions source) via the workflow token.
          # Removes the manual Settings → Pages click.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          # Only the served site — config files at repo root stay out of it.
          path: ./public
      - id: deployment
        uses: actions/deploy-pages@v4
